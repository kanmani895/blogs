<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #0abde3, #10ac84);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .profile {
      background-blend-mode: overlay;
      height: 100px;
    }
    .photo {
      background-color:white;
      border-radius: 10px;
    }
    h1{
      color: black;
      text-align: center;
      font-size: 18px;
    }
    p
    {
      text-align: center;
    }
   
    
  </style>
</head>
<body>
  <div>
    <div class="profile"
    style="display: flex; flex-direction:column; align-items:center; background-blend-mode:overlay" >
      <img src="./images/bg-pattern-card.svg"
      style="border: radius 10px;">
    </div>
   <div class="photo" 
      style="display: flex; flex-direction:column; justify-content:center;align-items:center;" >
      <!-- DP -->
      <img src="./images/image-victor.jpg" 
        style="border-radius: 50%; margin-top:25px" height="100px" width="100" >
    </div>
        

    <!-- Profile Details -->
    <div>
      <h1>Victor Crest <b>26</b></h1>
      <p> London</p>
    </div>
        <hr>
<div style="display: flex; justify-content:space-around;">
    <div>
      <h1> 80K</h1>
      <p> Followers</p>
    </div>
  <div>
    <h1>803K</h1>
    <p> Likes</p>
    </div>
  <div>
    <h1>1.4K</h1>
    <p>Photos</p>
  </div>
</div>
</div>
</div>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
